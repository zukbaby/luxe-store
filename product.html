<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUXE Product</title><style>
*{box-sizing:border-box}body{margin:0;color:#191919;background:#fff;font-family:Arial,sans-serif}.top{padding:17px 6%;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.logo{color:#b88932;font-weight:900;letter-spacing:3px}a{color:inherit;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:30px 18px}.card{border:1px solid #eee;border-radius:14px;overflow:hidden}.visual{height:min(55vw,380px);background:#faf8f3;display:grid;place-items:center}.visual img{width:100%;height:100%;object-fit:contain}.info{padding:22px}.price{color:#b88932;font-size:22px;font-weight:bold}.muted{color:#777;font-size:13px;line-height:1.6}.btn{background:#b88932;color:white;border:0;border-radius:7px;padding:11px 15px;font-weight:bold}.review{border-bottom:1px solid #eee;padding:12px 0}.notice{padding:12px;background:#fff8e9;border:1px solid #efdfb9;border-radius:8px;font-size:12px;margin:12px 0}
</style></head><body><header class="top"><a class="logo" href="index.html">LUXE STORE</a><a href="marketplace.html">← Marketplace</a></header><main class="wrap"><div id="notice" class="notice">Loading product…</div><article class="card" id="product" hidden><div class="visual" id="visual"></div><div class="info"><div class="muted" id="seller"></div><h1 id="title"></h1><p class="price" id="price"></p><p class="muted" id="description"></p><button class="btn" id="add">Add to cart</button></div></article><section><h2>Customer reviews</h2><div id="reviews" class="muted">Loading reviews…</div></section></main><script src="/luxe-auth.js"></script><script>
const id=new URLSearchParams(location.search).get("id"),el=x=>document.getElementById(x);let clerk=null,product=null;
(async()=>{try{clerk=await window.LUXE_AUTH}catch{}if(!id){el("notice").textContent="Product ID is missing.";return}try{const [p,r]=await Promise.all([fetch("/api/products/"+encodeURIComponent(id),{cache:"no-store"}),fetch("/api/products/"+encodeURIComponent(id)+"/reviews",{cache:"no-store"})]);const data=await p.json().catch(()=>({}));if(!p.ok){el("notice").textContent="This product is not available.";return}product=data.product;el("product").hidden=false;el("notice").textContent="Published LUXE listing · Stock "+product.stock_quantity;el("seller").textContent=product.store_name;el("title").textContent=product.title;el("price").textContent="D"+Number(product.price_gmd).toLocaleString();el("description").textContent=product.description||"";if(product.image_url&&/^https:\/\//i.test(product.image_url)){const img=document.createElement("img");img.src=product.image_url;img.alt=product.title;el("visual").append(img)}else el("visual").textContent="✦";el("add").addEventListener("click",async()=>{if(!clerk?.isSignedIn){el("notice").textContent="Sign in to add products to your cart.";return}try{const token=await clerk.session.getToken();const response=await fetch("/api/cart",{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({productId:product.id,quantity:1})});el("notice").textContent=response.ok?"Added to your cart.":"Could not add this item. Check stock and account setup."}catch{el("notice").textContent="Cart service is unavailable."}});const reviews=await r.json().catch(()=>({}));el("reviews").replaceChildren();(reviews.reviews||[]).forEach(review=>{const item=document.createElement("article");item.className="review";const heading=document.createElement("b");heading.textContent="★".repeat(review.rating)+" · "+review.title;const body=document.createElement("p");body.textContent=review.body;item.append(heading,body);el("reviews").append(item)});if(!reviews.reviews?.length)el("reviews").textContent="No published reviews yet."}catch{el("notice").textContent="Could not connect to product details."}})();
</script></body></html>
