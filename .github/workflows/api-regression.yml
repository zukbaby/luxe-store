name: API regression checks

on:
  push:
    branches:
      - main
      - build/dama-ai-regression-tests
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check API syntax
        run: npm run check:api
      - name: Run AI API regression tests
        run: npm run test:api
