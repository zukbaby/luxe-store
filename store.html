<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUXE Seller Storefront</title><style>
*{box-sizing:border-box}body{margin:0;color:#191919;background:#fff;font-family:Arial,sans-serif}.top{padding:17px 6%;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.logo{color:#b88932;font-weight:900;letter-spacing:3px}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.hero{border:1px solid #eee;border-radius:14px;padding:24px;background:#fffdf8}.muted{color:#777;font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:22px}.card{border:1px solid #eee;border-radius:12px;overflow:hidden}.visual{height:170px;background:#faf8f3;display:grid;place-items:center}.visual img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.price{color:#b88932;font-weight:bold}.btn{border:1px solid #b88932;background:white;color:#8b6829;border-radius:7px;padding:9px 12px;font-weight:bold;cursor:pointer}.seller-handle{font-size:13px;color:#777}.luxe-verified-badge{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.18em;margin-inline-start:.32em}.luxe-verified-badge svg{width:100%;height:100%;display:block}.luxe-verified-badge--blue{color:#2478e5}.luxe-verified-badge--green{color:#16845b}.luxe-verified-badge--gold{color:#b88932}.notice{padding:13px;background:#fff8e9;border:1px solid #efdfb9;border-radius:8px;color:#6b552d;font-size:12px;margin-top:16px}
</style></head><body><header class="top"><a class="logo" href="index.html">LUXE STORE</a><a href="marketplace.html">← Marketplace</a></header><main class="wrap"><section class="hero"><div class="muted">LUXE VERIFIED MARKETPLACE STOREFRONT</div><h1 id="name">Loading store…</h1><p class="seller-handle" id="sellerIdentity"></p><p class="muted" id="description"></p></section><div class="notice" id="notice" role="status">Loading public storefront…</div><div class="grid" id="products"></div></main><script src="/luxe-badges.js"></script><script src="/luxe-auth.js"></script><script>
const slug=new URLSearchParams(location.search).get("slug")||"",root=document.getElementById("products");let clerk=null;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function add(p){if(!clerk?.isSignedIn){document.getElementById("notice").textContent="Sign in to add products to your cart.";return}try{const token=await clerk.session.getToken();const r=await fetch("/api/cart",{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({productId:p.id,quantity:1})});if(r.ok)document.getElementById("notice").textContent=p.title+" added to your cart.";else document.getElementById("notice").textContent="Could not add this item. Check availability and sign-in setup."}catch{document.getElementById("notice").textContent="Cart service is not available yet."}}
(async()=>{try{clerk=await window.LUXE_AUTH}catch{}if(!slug){document.getElementById("notice").textContent="A storefront URL is required.";return}try{const r=await fetch("/api/sellers/"+encodeURIComponent(slug),{cache:"no-store"}),d=await r.json().catch(()=>({}));if(!r.ok){document.getElementById("name").textContent="Store unavailable";document.getElementById("notice").textContent=r.status===503?"Database setup is required before public storefronts can load.":"This storefront could not be found.";return}document.getElementById("name").textContent=d.store.store_name;if(d.store.username)window.LUXE_BADGES?.setName(document.getElementById("sellerIdentity"),"@"+d.store.username,d.store.badge_color);document.getElementById("description").textContent=d.store.description||"Welcome to this LUXE seller storefront.";document.getElementById("notice").textContent=(d.products||[]).length+" published listing(s).";(d.products||[]).forEach(p=>{const card=el("article",undefined,"card"),visual=el("div",undefined,"visual");if(p.image_url&&/^https:\/\//i.test(p.image_url)){const img=el("img");img.src=p.image_url;img.alt=p.title;visual.append(img)}else visual.textContent="✦";const info=el("div",undefined,"info");info.append(el("h3",p.title),el("p",p.description||"","muted"),el("p","D"+Number(p.price_gmd).toLocaleString(),"price"));const button=el("button","Add to cart","btn");button.addEventListener("click",()=>add(p));info.append(button);card.append(visual,info);root.append(card)});if(!d.products?.length)root.append(el("p","No published products yet.","muted"))}catch{document.getElementById("notice").textContent="Could not connect to this storefront."}})();
</script></body></html>
